<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photogasm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B0F30; --surface:#2E1B52; --surface-2:#3A2465;
  --ink:#FBF7F0; --ink-dim:#C9BEDD;
  --pink:#FF3D81; --yellow:#FFD93D; --cyan:#3FD9C7; --card-ink:#1B0F30;
  --font-display:'Baloo 2', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
  --font-body:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1B0F30; --surface:#2E1B52; --ink:#FBF7F0; --ink-dim:#C9BEDD; } }
:root[data-theme="dark"]{ --bg:#1B0F30; --surface:#2E1B52; --ink:#FBF7F0; --ink-dim:#C9BEDD; }
*{ box-sizing:border-box; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); min-height:100%; overflow-x:hidden; }
.page{ max-width:520px; margin:0 auto; padding:48px 20px 64px; }
.hero{ text-align:center; margin-bottom:32px; }
.hero-badge{ width:56px; height:56px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 16px; border:2px solid var(--surface-2); }
.wordmark{ font-family:var(--font-display); font-weight:800; font-size:clamp(2.4rem,9vw,3.2rem); margin:0 0 12px; letter-spacing:-0.01em; }
.tagline{ color:var(--ink-dim); font-size:1rem; line-height:1.5; max-width:36ch; margin:0 auto; }
.dropzone{ background:var(--surface); border:2px dashed var(--surface-2); border-radius:20px; padding:48px 24px; text-align:center; }
.btn-upload{ font-family:var(--font-display); font-weight:700; font-size:1.05rem; background:var(--pink); color:var(--ink); border:none; border-radius:999px; padding:14px 32px; cursor:pointer; }
.btn-upload:hover{ filter:brightness(1.08); }
.dropzone-hint{ color:var(--ink-dim); font-size:.9rem; margin:16px 0 0; }
canvas{ width:100%; height:auto; display:block; border-radius:20px; touch-action:none; cursor:grab; }
.controls{ margin-top:20px; display:flex; flex-direction:column; gap:16px; }
.control-group{ display:flex; flex-direction:column; gap:8px; }
.control-label{ font-size:.85rem; font-weight:600; color:var(--ink-dim); }
.mascot-picker{ display:flex; gap:10px; }
.mascot-swatch{ width:56px; height:56px; padding:4px; border-radius:16px; border:2px solid var(--surface-2); background:var(--surface); cursor:pointer; }
.mascot-swatch svg{ width:100%; height:100%; display:block; }
.mascot-swatch.active{ border-color:var(--yellow); background:var(--surface-2); }
input[type=text], input[type=file]{ font-family:var(--font-body); background:var(--surface); border:1.5px solid var(--surface-2); border-radius:12px; padding:12px 14px; color:var(--ink); font-size:.95rem; width:100%; }
input[type=text]::placeholder{ color:var(--ink-dim); }
.drag-hint{ font-size:.85rem; color:var(--ink-dim); margin:0; }
.action-row{ display:flex; gap:12px; margin-top:4px; }
.btn-secondary, .btn-primary{ flex:1; font-family:var(--font-body); font-weight:700; font-size:.95rem; border-radius:999px; padding:13px 18px; border:none; cursor:pointer; }
.btn-secondary{ background:var(--surface-2); color:var(--ink); }
.btn-primary{ background:var(--yellow); color:var(--card-ink); }
.btn-secondary:hover, .btn-primary:hover{ filter:brightness(1.08); }
.save-note{ text-align:center; font-size:.85rem; color:var(--cyan); margin:0; }
[hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="hero-badge">📸</div>
    <h1 class="wordmark">Photogasm</h1>
    <p class="tagline">Upload foto, satu karakter random ikut nampang di sebelahmu. Tinggal tambahin logo sponsor, langsung siap dibagikan.</p>
  </header>

  <main class="booth">
    <div class="dropzone" id="dropzone">
      <input type="file" id="photoInput" accept="image/*" hidden>
      <button type="button" class="btn-upload" id="uploadBtn">Pilih Foto</button>
      <p class="dropzone-hint">atau tarik &amp; taruh foto di sini</p>
    </div>

    <div class="stage" id="stage" hidden>
      <canvas id="canvas" width="640" height="884" aria-label="Pratinjau hasil foto Photogasm">Pratinjau foto Photogasm</canvas>

      <div class="controls">
        <div class="control-group">
          <span class="control-label">Karakter</span>
          <div class="mascot-picker" id="mascotPicker"></div>
        </div>

        <div class="control-group">
          <label class="control-label" for="sponsorText">Nama sponsor</label>
          <input type="text" id="sponsorText" placeholder="Sponsor Kamu" maxlength="24">
        </div>

        <div class="control-group">
          <label class="control-label" for="logoInput">Logo sponsor (opsional, gambar)</label>
          <input type="file" id="logoInput" accept="image/*">
        </div>

        <p class="drag-hint">Seret karakternya kalau mau pindahin posisi 👆</p>

        <div class="action-row">
          <button type="button" class="btn-secondary" id="resetBtn">Ganti Foto</button>
          <button type="button" class="btn-primary" id="saveBtn">Simpan Foto</button>
        </div>
        <p class="save-note" id="saveNote" hidden></p>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  const MASCOTS = [
    { id:'zoop', name:'Zoop', svg:`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="118" rx="70" ry="62" fill="#FFD93D" stroke="#E8B800" stroke-width="4"/>
      <path d="M96 26 L114 26 L102 58 L120 58 L94 100 L102 66 L86 66 Z" fill="#FF3D81"/>
      <circle cx="78" cy="108" r="15" fill="#1B0F30"/><circle cx="122" cy="108" r="15" fill="#1B0F30"/>
      <circle cx="82" cy="104" r="4.5" fill="#fff"/><circle cx="126" cy="104" r="4.5" fill="#fff"/>
      <ellipse cx="100" cy="142" rx="18" ry="12" fill="#1B0F30"/>
      <path d="M38 150 Q14 120 30 90" stroke="#FFD93D" stroke-width="16" fill="none" stroke-linecap="round"/>
      <circle cx="30" cy="88" r="13" fill="#FFD93D" stroke="#E8B800" stroke-width="4"/>
    </svg>` },
    { id:'miko', name:'Miko', svg:`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="118" rx="70" ry="62" fill="#FF3D81" stroke="#D91E63" stroke-width="4"/>
      <path d="M100 22 L108 40 L128 42 L112 54 L118 74 L100 62 L82 74 L88 54 L72 42 L92 40 Z" fill="#FFD93D"/>
      <circle cx="78" cy="110" r="14" fill="#1B0F30"/><circle cx="122" cy="110" r="14" fill="#1B0F30"/>
      <circle cx="82" cy="106" r="4" fill="#fff"/><circle cx="126" cy="106" r="4" fill="#fff"/>
      <path d="M80 140 Q100 154 120 140" stroke="#1B0F30" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M36 148 Q18 112 42 86" stroke="#FF3D81" stroke-width="15" fill="none" stroke-linecap="round"/>
      <path d="M164 148 Q182 112 158 86" stroke="#FF3D81" stroke-width="15" fill="none" stroke-linecap="round"/>
      <circle cx="42" cy="84" r="12" fill="#FF3D81" stroke="#D91E63" stroke-width="4"/>
      <circle cx="158" cy="84" r="12" fill="#FF3D81" stroke="#D91E63" stroke-width="4"/>
    </svg>` },
    { id:'balu', name:'Balu', svg:`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="118" rx="70" ry="62" fill="#3FD9C7" stroke="#22B3A2" stroke-width="4"/>
      <rect x="54" y="96" width="36" height="28" rx="12" fill="#1B0F30"/>
      <rect x="110" y="96" width="36" height="28" rx="12" fill="#1B0F30"/>
      <rect x="90" y="104" width="20" height="6" rx="3" fill="#1B0F30"/>
      <path d="M86 148 Q100 156 114 148" stroke="#1B0F30" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M158 140 Q180 118 168 92" stroke="#3FD9C7" stroke-width="16" fill="none" stroke-linecap="round"/>
      <circle cx="168" cy="90" r="14" fill="#3FD9C7" stroke="#22B3A2" stroke-width="4"/>
      <path d="M162 90 l4 5 l9 -10" stroke="#1B0F30" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>` }
  ];

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const PAD=24, PHOTO_X=24, PHOTO_Y=24, PHOTO_W=W-PAD*2, PHOTO_H=740;
  const STRIP_Y = PHOTO_Y+PHOTO_H, STRIP_H = H-STRIP_Y-PAD;

  let photoImg=null, logoImg=null, mascotImgs={}, currentMascotId=MASCOTS[0].id;
  let mascotPos={ x:PHOTO_X+PHOTO_W*0.72, y:PHOTO_Y+PHOTO_H*0.7 };
  let mascotScale=0, dragging=false, dragOffset={x:0,y:0};

  function loadImage(src){
    return new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=reject;
      img.src=src;
    });
  }

  Promise.all(MASCOTS.map(m=>
    loadImage('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(m.svg)).then(img=>{ mascotImgs[m.id]=img; })
  ));

  function mascotBaseSize(){ return PHOTO_W*0.34; }

  function roundedRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#1B0F30'; ctx.fillRect(0,0,W,H);

    ctx.save();
    roundedRect(PHOTO_X-6,PHOTO_Y-6,PHOTO_W+12,PHOTO_H+12,18);
    ctx.fillStyle='#FF3D81'; ctx.fill();
    ctx.restore();

    ctx.save();
    roundedRect(PHOTO_X,PHOTO_Y,PHOTO_W,PHOTO_H,14);
    ctx.clip();
    if(photoImg){
      const scale=Math.max(PHOTO_W/photoImg.width, PHOTO_H/photoImg.height);
      const iw=photoImg.width*scale, ih=photoImg.height*scale;
      ctx.drawImage(photoImg, PHOTO_X+(PHOTO_W-iw)/2, PHOTO_Y+(PHOTO_H-ih)/2, iw, ih);
    } else {
      ctx.fillStyle='#2E1B52'; ctx.fillRect(PHOTO_X,PHOTO_Y,PHOTO_W,PHOTO_H);
    }
    const mImg=mascotImgs[currentMascotId];
    if(mImg && mascotScale>0){
      const size=mascotBaseSize()*mascotScale;
      ctx.drawImage(mImg, mascotPos.x-size/2, mascotPos.y-size/2, size, size);
    }
    ctx.restore();

    roundedRect(PHOTO_X,STRIP_Y,PHOTO_W,STRIP_H,10);
    ctx.fillStyle='#FBF7F0'; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle='#FF3D81';
    roundedRect(PHOTO_X,STRIP_Y,PHOTO_W,STRIP_H,10); ctx.stroke();

    ctx.fillStyle='#1B0F30';
    ctx.font="700 30px 'Baloo 2', sans-serif";
    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.fillText('Photogasm', PHOTO_X+20, STRIP_Y+STRIP_H/2);

    ctx.strokeStyle='rgba(27,15,48,0.15)'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(PHOTO_X+PHOTO_W/2, STRIP_Y+16);
    ctx.lineTo(PHOTO_X+PHOTO_W/2, STRIP_Y+STRIP_H-16);
    ctx.stroke();

    const areaX=PHOTO_X+PHOTO_W/2+20, areaW=PHOTO_W/2-40;
    if(logoImg){
      const maxW=areaW, maxH=STRIP_H-24;
      const s=Math.min(maxW/logoImg.width, maxH/logoImg.height);
      const lw=logoImg.width*s, lh=logoImg.height*s;
      ctx.drawImage(logoImg, areaX+(areaW-lw)/2, STRIP_Y+(STRIP_H-lh)/2, lw, lh);
    } else {
      const text=(document.getElementById('sponsorText').value || 'Sponsor Kamu').trim();
      ctx.font="600 22px 'Plus Jakarta Sans', sans-serif";
      ctx.textAlign='center'; ctx.fillStyle='#5B4A7A';
      ctx.fillText(text, areaX+areaW/2, STRIP_Y+STRIP_H/2);
    }
  }

  function popInMascot(){
    mascotScale=0;
    const start=performance.now(), dur=380;
    function step(t){
      const p=Math.min(1,(t-start)/dur);
      mascotScale=1-Math.pow(1-p,3);
      render();
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  document.fonts.ready.then(()=>{ if(photoImg) render(); });

  const photoInput=document.getElementById('photoInput');
  const uploadBtn=document.getElementById('uploadBtn');
  const dropzone=document.getElementById('dropzone');
  const stage=document.getElementById('stage');

  uploadBtn.addEventListener('click', ()=>photoInput.click());
  photoInput.addEventListener('change', e=>{ if(e.target.files[0]) loadPhotoFile(e.target.files[0]); });
  ['dragover','drop'].forEach(evt=>dropzone.addEventListener(evt, e=>e.preventDefault()));
  dropzone.addEventListener('drop', e=>{ if(e.dataTransfer.files[0]) loadPhotoFile(e.dataTransfer.files[0]); });

  async function loadPhotoFile(file){
    if(!file.type.startsWith('image/')) return;
    photoImg = await loadImage(URL.createObjectURL(file));
    dropzone.hidden=true; stage.hidden=false;
    mascotPos={ x:PHOTO_X+PHOTO_W*0.72, y:PHOTO_Y+PHOTO_H*0.7 };
    popInMascot();
  }

  const pickerEl=document.getElementById('mascotPicker');
  MASCOTS.forEach((m,i)=>{
    const btn=document.createElement('button');
    btn.type='button'; btn.className='mascot-swatch'+(i===0?' active':'');
    btn.innerHTML=m.svg; btn.setAttribute('aria-label', m.name);
    btn.addEventListener('click', ()=>{
      currentMascotId=m.id;
      [...pickerEl.children].forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      if(photoImg) popInMascot();
    });
    pickerEl.appendChild(btn);
  });

  document.getElementById('sponsorText').addEventListener('input', ()=>{ if(photoImg) render(); });
  document.getElementById('logoInput').addEventListener('change', async e=>{
    const file=e.target.files[0];
    logoImg = file ? await loadImage(URL.createObjectURL(file)) : null;
    if(photoImg) render();
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    photoImg=null; logoImg=null;
    photoInput.value=''; document.getElementById('logoInput').value=''; document.getElementById('sponsorText').value='';
    currentMascotId=MASCOTS[0].id;
    [...pickerEl.children].forEach((c,i)=>c.classList.toggle('active', i===0));
    stage.hidden=true; dropzone.hidden=false;
  });

  function getCanvasPos(e){
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
    const cx=e.touches?e.touches[0].clientX:e.clientX, cy=e.touches?e.touches[0].clientY:e.clientY;
    return { x:(cx-rect.left)*scaleX, y:(cy-rect.top)*scaleY };
  }
  canvas.addEventListener('pointerdown', e=>{
    if(!photoImg) return;
    const pos=getCanvasPos(e), size=mascotBaseSize()*mascotScale;
    const dx=pos.x-mascotPos.x, dy=pos.y-mascotPos.y;
    if(Math.hypot(dx,dy) < size/2+10){
      dragging=true; dragOffset={x:dx,y:dy};
      canvas.setPointerCapture(e.pointerId); canvas.style.cursor='grabbing';
    }
  });
  canvas.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const pos=getCanvasPos(e);
    mascotPos.x=Math.min(Math.max(pos.x-dragOffset.x, PHOTO_X), PHOTO_X+PHOTO_W);
    mascotPos.y=Math.min(Math.max(pos.y-dragOffset.y, PHOTO_Y), PHOTO_Y+PHOTO_H);
    render();
  });
  ['pointerup','pointercancel'].forEach(evt=>canvas.addEventListener(evt, ()=>{ dragging=false; canvas.style.cursor='grab'; }));

  let downloadsCap=null;
  const saveBtn=document.getElementById('saveBtn'), saveNote=document.getElementById('saveNote');
  (async ()=>{
    try{ downloadsCap = window.claude ? await window.claude.use('downloads') : null; }
    catch(e){ downloadsCap=null; }
    if(!downloadsCap){ saveBtn.hidden=true; saveNote.hidden=false; saveNote.textContent='Simpan fotonya lewat screenshot, ya.'; }
  })();

  saveBtn.addEventListener('click', ()=>{
    if(!downloadsCap) return;
    canvas.toBlob(async blob=>{
      if(!blob) return;
      try{
        await downloadsCap.save({ filename:'photogasm.png', data: blob });
        saveNote.hidden=false; saveNote.textContent='Foto kesimpen ✅';
      } catch(err){
        if(err && err.code==='declined'){ saveNote.hidden=true; }
        else { saveNote.hidden=false; saveNote.textContent='Gagal nyimpen, coba lagi ya.'; }
      }
    }, 'image/png');
  });
})();
</script>
</body>
</html>
